<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2a44">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="大阪地鐵">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>大阪地鐵隨身指南</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap" rel="stylesheet">
<style>
:root {
  /* Station-signage look: white panels, line-colour roundels, Midosuji red as the one accent. Phone-first, bottom tab bar. */
  --paper: #f3f2ef;
  --surface: #ffffff;
  --ink: #1b1c1f;
  --muted: #62656c;
  --rule: #dcdbd6;
  --accent: #e5171f;
  --accent-soft: #fde8e8;
  --sign: #1f2a44;
  --sign-ink: #ffffff;
  --display: "Zen Kaku Gothic New", "Noto Sans TC", "Hiragino Sans", sans-serif;
  --body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --num: "Barlow Condensed", "Arial Narrow", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #131416; --surface: #1d1f23; --ink: #eceae6; --muted: #a2a5ab; --rule: #33363c;
    --accent: #ff4b50; --accent-soft: #3a1d1f; --sign: #2c3a5c; --sign-ink: #ffffff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #131416; --surface: #1d1f23; --ink: #eceae6; --muted: #a2a5ab; --rule: #33363c;
  --accent: #ff4b50; --accent-soft: #3a1d1f; --sign: #2c3a5c; --sign-ink: #ffffff; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.55; -webkit-text-size-adjust: 100%; }
.app { overflow-x: hidden; max-width: 560px; margin: 0 auto; min-height: 100%; padding: 0 16px 96px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: max(18px, calc(env(safe-area-inset-top) + 8px)) 0 12px; }
header h1 { font-family: var(--display); font-weight: 900; font-size: 22px; margin: 0; letter-spacing: .02em; text-wrap: balance; }
.home { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.roundel { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 50%; border: 3.5px solid var(--c, var(--accent)); background: var(--surface); color: var(--ink); font-family: var(--num); font-weight: 700; line-height: .9; flex: 0 0 auto; }
.roundel b { font-size: 11px; color: var(--c, var(--accent)); }
.roundel span { font-size: 14px; }
.roundel.sm { width: 28px; height: 28px; border-width: 3px; }
.roundel.sm b { font-size: 9.5px; } .roundel.sm span { font-size: 12px; }
.tag { display: inline-flex; align-items: center; justify-content: center; min-width: 34px; height: 24px; padding: 0 7px; border-radius: 5px; background: var(--c); color: #fff; font-size: 12px; font-weight: 700; white-space: nowrap; }
section[data-view] { display: none; }
section[data-view].on { display: block; }
h2 { font-family: var(--display); font-size: 17px; margin: 18px 0 10px; text-wrap: balance; }
.lead { color: var(--muted); font-size: 13.5px; margin: 0 0 12px; }

/* day chips */
.days { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; padding: 4px 0 10px; }
.days::-webkit-scrollbar { display: none; }
.day { min-width: 0; border: 1.5px solid var(--rule); background: var(--surface); color: var(--ink); border-radius: 12px; padding: 7px 4px; font: inherit; font-size: 11.5px; text-align: center; cursor: pointer; }
.day .dw { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
.day[aria-pressed="true"] .dw { color: var(--ink); }
.day b { display: block; font-family: var(--num); font-size: 16px; line-height: 1.2; }
.day[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.day:focus-visible, .tab:focus-visible, .st:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.dayhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 6px 0 10px; }
.dayhead .go { display: block; margin-top: 2px; }
.editbtn { font: inherit; font-size: 13px; font-weight: 700; padding: 7px 12px; border-radius: 999px; border: 1.5px solid var(--accent); background: var(--surface); color: var(--accent); white-space: nowrap; cursor: pointer; }
.editbtn[aria-pressed="true"] { background: var(--accent); color: #fff; }
body:not(.editing) .tctl, body:not(.editing) .edited, body:not(.editing) .spbar { display: none; }
body:not(.editing) .spot.sp { cursor: default; }
body.editing .spot.sp { box-shadow: inset 0 0 0 1px var(--accent); }
.edit-hint { font-size: 12.5px; color: var(--accent); background: var(--accent-soft); border-radius: 10px; padding: 6px 10px; }
body:not(.editing) .edit-hint { display: none; }
.dayhead h2 { margin: 0; }
.dayhead .go { font-size: 13px; color: var(--muted); white-space: nowrap; }

/* leg cards */
.legs { display: grid; gap: 10px; }
.leg { background: var(--surface); border-radius: 14px; padding: 12px 14px; border-left: 6px solid var(--c, var(--rule)); display: grid; gap: 8px; }
.leg.walk { background: transparent; border: 1.5px dashed var(--rule); border-left-width: 1.5px; padding: 9px 14px; }
.leg-top { display: flex; align-items: center; gap: 10px; }
.route { font-family: var(--display); font-weight: 700; font-size: 17px; line-height: 1.3; }
.route .arr { color: var(--muted); margin: 0 4px; font-weight: 400; }
.signbox { background: var(--sign); color: var(--sign-ink); border-radius: 8px; padding: 7px 10px; font-family: var(--display); font-weight: 700; font-size: 15px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.signbox small { font-family: var(--body); font-weight: 400; font-size: 11.5px; opacity: .75; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12.5px; background: var(--paper); border: 1px solid var(--rule); border-radius: 999px; padding: 1px 9px; font-variant-numeric: tabular-nums; }
.note { font-size: 13px; color: var(--muted); }
.warn { color: var(--accent); font-weight: 500; }
.walk .route { font-size: 14.5px; font-family: var(--body); font-weight: 500; }

/* Midosuji line */
.picker { display: grid; grid-template-columns: minmax(0, 1fr); min-width: 0; gap: 8px; background: var(--surface); border-radius: 14px; padding: 12px 14px; position: sticky; top: 0; z-index: 2; box-shadow: 0 6px 14px -12px rgba(0,0,0,.4); }
.picker label { font-size: 12px; color: var(--muted); }
.picker select { width: 100%; font: inherit; font-size: 15px; padding: 8px 10px; border-radius: 10px; border: 1.5px solid var(--rule); background: var(--paper); color: var(--ink); }
.result { display: grid; gap: 6px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 8px; }
.stats > div { background: var(--surface); border-radius: 12px; padding: 8px 6px; text-align: center; }
.stats .n { display: block; font-family: var(--num); font-weight: 700; font-size: 24px; color: var(--accent); line-height: 1.1; }
.stats small { font-size: 12px; color: var(--muted); }
.result .big { font-family: var(--display); font-size: 18px; font-weight: 700; }
.result .big .n { font-family: var(--num); font-size: 26px; color: var(--accent); margin: 0 2px; }
.line { position: relative; margin: 14px 0 0; padding-left: 4px; }
.line::before { content: ""; position: absolute; left: 21px; top: 18px; bottom: 18px; width: 8px; background: #e5171f; border-radius: 4px; }
.st { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; background: none; border: 0; color: var(--ink); font: inherit; text-align: left; padding: 6px 4px; border-radius: 10px; cursor: pointer; }
.st .roundel { position: relative; z-index: 1; }
.st .nm { font-family: var(--display); font-weight: 700; font-size: 16px; }
.st .zh { font-size: 12px; color: var(--muted); margin-left: 6px; font-family: var(--body); font-weight: 400; }
.st .xf { display: block; font-size: 12px; color: var(--muted); }
.st.from { background: var(--accent-soft); }
.st.to { background: var(--surface); outline: 2px solid var(--accent); }
.st.between .roundel { border-color: #f59a9d; }
.st .pin { margin-left: auto; font-size: 11.5px; font-weight: 700; color: #fff; background: var(--accent); border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
.legend { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-top: 8px; }
.legend div { display: flex; align-items: center; gap: 8px; background: var(--surface); border-radius: 10px; padding: 7px 10px; font-size: 13px; }

/* transfer + signs */
.card { background: var(--surface); border-radius: 14px; padding: 12px 14px; display: grid; gap: 6px; }
.stack { display: grid; gap: 10px; }
.card h3 { margin: 0; font-family: var(--display); font-size: 16px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.card ol { margin: 0; padding-left: 20px; font-size: 14px; }
.card ol li { margin: 2px 0; }
.kw { font-family: var(--display); font-weight: 700; background: var(--sign); color: var(--sign-ink); padding: 0 6px; border-radius: 4px; white-space: nowrap; }
.vocab { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.vocab .card { gap: 2px; }
.vocab .jp { font-family: var(--display); font-weight: 900; font-size: 19px; }
.vocab .rd { font-size: 11.5px; color: var(--muted); }
.vocab .mn { font-size: 13.5px; }


.pick-row { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: end; }
.pick-col { display: grid; gap: 2px; min-width: 0; }
.swap { font: inherit; font-size: 18px; width: 40px; height: 40px; border-radius: 10px; border: 1.5px solid var(--rule); background: var(--paper); color: var(--ink); cursor: pointer; }
.picker { position: static; }
.rstep { background: var(--paper); border-radius: 12px; padding: 10px 12px; border-left: 6px solid var(--c, var(--rule)); display: grid; gap: 7px; }
.rstep.walk { border: 1.5px dashed var(--rule); background: transparent; font-size: 13.5px; }
.lname { font-size: 12px; color: var(--muted); }
.lchips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 8px; scrollbar-width: none; }
.lchips::-webkit-scrollbar { display: none; }
.lchip { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: 13px; background: var(--surface); color: var(--ink); border: 1.5px solid var(--rule); border-radius: 999px; padding: 4px 12px 4px 5px; cursor: pointer; }
.lchip[aria-pressed="true"] { border-color: var(--ink); font-weight: 700; }
.tapbar { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); margin: 2px 0 4px; }
.seg { font: inherit; font-size: 13px; border: 1.5px solid var(--rule); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 2px 12px; cursor: pointer; }
.seg[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.line::before { background: var(--lc, #e5171f) !important; }
.node { width: 22px; height: 22px; margin: 0 3px; border-radius: 50%; background: var(--surface); border: 5px solid var(--c); position: relative; z-index: 1; flex: 0 0 auto; }
.nmw { display: grid; }
.st .xf { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 2px; }
.dot { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 17px; padding: 0 4px; border-radius: 4px; background: var(--c); color: #fff; font-size: 10.5px; font-weight: 700; }
.lchip:focus-visible, .seg:focus-visible, .swap:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }


.tripc { width: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: center; text-align: left; font: inherit; color: var(--ink); background: var(--surface); border: 0; border-left: 6px solid var(--accent); border-radius: 14px; padding: 12px 14px; cursor: pointer; }
.tripc .tnum { align-self: start; padding-top: 2px; }
.tfoot { display: flex; align-items: center; gap: 8px; margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--rule); }
.tfoot .tgo { margin-left: auto; background: var(--accent-soft) !important; border-radius: 999px !important; padding: 5px 12px !important; }
.tripc .tnum { font-family: var(--num); font-weight: 700; font-size: 20px; color: var(--accent); }
.tripc .tbody { display: grid; gap: 3px; }
.tripc .tgo { font-size: 13px; font-weight: 700; color: var(--accent); white-space: nowrap; }
.tripc:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.tipbox { background: var(--accent-soft); border-radius: 10px; padding: 8px 12px; font-size: 13.5px; }
.xfer { border: 1.5px dashed var(--rule); border-radius: 12px; padding: 9px 12px; display: grid; gap: 4px; font-size: 13.5px; }
.xhead { font-weight: 700; }
.xroute { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.xtip { color: var(--muted); }
.plan-card { background: var(--surface); border-radius: 14px; padding: 12px 14px; display: grid; gap: 8px; margin: 10px 0; }
.pc-head { font-family: var(--display); font-weight: 700; font-size: 15px; }
.homec { padding: 10px 14px; }
.homec > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 4px; }
.homec > summary::-webkit-details-marker { display: none; }
.homec .chg { margin-left: auto; font-size: 13px; color: var(--accent); }
.homec[open] .chg { visibility: hidden; }
.pc-row { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px; align-items: center; }
.pc-row select, .pc-row input { width: 100%; min-width: 0; font-size: 16px; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--line, #ccc); background: var(--bg, #fff); color: inherit; }
.pc-btn { font: inherit; font-size: 14px; font-weight: 700; padding: 9px 12px; border-radius: 10px; border: 1.5px solid var(--accent); background: var(--surface); color: var(--accent); white-space: nowrap; cursor: pointer; }
.pc-btn.main { background: var(--accent); color: #fff; }
.pc-btn.sm { font-size: 12.5px; padding: 5px 9px; }
.pc-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.rec { border: 1.5px solid var(--line, #ddd); border-radius: 12px; padding: 10px 12px; display: grid; gap: 6px; }
.rec.best { border-color: var(--accent); background: var(--accent-soft); }
.rec .rt { font-weight: 700; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.rec .tagb { font-size: 11.5px; background: var(--accent); color: #fff; border-radius: 999px; padding: 1px 8px; }
.addi { display: grid; grid-template-columns: minmax(0,1fr) auto auto; gap: 6px; align-items: center; padding: 6px 0; border-top: 1px dashed var(--line, #ddd); font-size: 14px; }
.addi select { font-size: 14px; padding: 5px; border-radius: 8px; }
.tripc.added { outline: 2px dashed var(--accent); }
.spot.new { background: var(--accent); color: #fff; }
.tripc.walkonly { opacity: .85; }
.tripc { cursor: default; }
.tripc .tgo { background: none; border: 0; font: inherit; font-size: 13px; font-weight: 700; color: var(--accent); cursor: pointer; padding: 6px 0; }
.tripc.ret { border-left-color: var(--muted); }
.rtag { font-size: 11.5px; font-weight: 700; background: var(--muted); color: #fff; border-radius: 999px; padding: 1px 8px; margin-left: 6px; vertical-align: 2px; }
.tctl { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; align-items: center; }
.tctl .ic { font: inherit; font-size: 13px; min-width: 34px; height: 30px; border-radius: 8px; border: 1px solid var(--line, #ccc); background: var(--bg, #fff); color: inherit; cursor: pointer; padding: 0 8px; }
.tctl .ic:disabled { opacity: .3; }
.tctl .ic.del { color: var(--accent); border-color: var(--accent); }
.tctl select { font-size: 13px; height: 30px; border-radius: 8px; border: 1px solid var(--line, #ccc); background: var(--bg, #fff); color: inherit; max-width: 120px; }
.edited { font-size: 13px; color: var(--muted); text-align: center; }
.linkb { font: inherit; background: none; border: 0; color: var(--accent); text-decoration: underline; cursor: pointer; padding: 0; }
.spot.sp { border: 0; font: inherit; font-size: 12.5px; cursor: pointer; }
.spot.sp.on { outline: 2px solid var(--accent); }
.spbar { display: grid; gap: 6px; background: var(--accent-soft); border-radius: 10px; padding: 8px 10px; margin-top: 4px; font-size: 13.5px; }
.spbtns { display: flex; gap: 6px; flex-wrap: wrap; }
.spbtns select { font-size: 13px; height: 30px; border-radius: 8px; border: 1px solid var(--line, #ccc); background: var(--bg, #fff); color: inherit; }
.spbtns .ic { font: inherit; font-size: 13px; height: 30px; border-radius: 8px; border: 1px solid var(--line, #ccc); background: var(--bg, #fff); color: inherit; padding: 0 10px; cursor: pointer; }
.spbtns .ic.del { color: var(--accent); border-color: var(--accent); }
.pool { display: grid; gap: 6px; }
.pooli { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 6px; align-items: center; padding: 6px 0; border-top: 1px dashed var(--line, #ddd); font-size: 14px; }
.pooli .pb { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.farebox { background: var(--surface); border-radius: 12px; padding: 8px 12px; font-size: 15px; line-height: 1.5; }
.farebox b { font-family: var(--num); font-size: 20px; color: var(--accent); }
.farebox span { font-size: 12.5px; color: var(--muted); }
.dfare { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; background: var(--surface); border-radius: 12px; padding: 8px 12px; margin: 0 0 10px; }
.dfare b { font-family: var(--num); font-size: 22px; color: var(--accent); }
.dfare .note { flex-basis: 100%; }
.dfare .dtrip { margin-left: auto; font-size: 13px; color: var(--muted); }
.dfare .dtrip b { font-size: 17px; color: var(--ink); }
.tside { display: grid; justify-items: end; gap: 2px; }
.lsplit { font-size: 11px; color: var(--muted); }
.lfare { font-family: var(--num); font-weight: 700; font-size: 14px; color: var(--ink); }
.askbox { border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); margin: 10px 0; padding: 8px 0; }
.askbox > summary { cursor: pointer; font-size: 14px; font-weight: 700; color: var(--accent); list-style: none; }
.askbox > summary::-webkit-details-marker { display: none; }
.askbox > summary::after { content: " ▾"; }
.askbox[open] > summary::after { content: " ▴"; }
.askbox .ask { border: 0; box-shadow: none; padding: 8px 0 0; margin: 0; background: none; }
.note.foot { margin-top: 12px; font-size: 12px; }
.toast { background: var(--sign); color: var(--sign-ink); border-radius: 10px; padding: 8px 12px; font-size: 14px; }
header .home { font: inherit; background: none; border: 0; color: inherit; cursor: pointer; padding: 4px 0; }
.xplat { margin: 4px 0 2px; font-size: 14px; }
.xplat b { color: var(--ink, #111); font-size: 16px; }
.signbox .plat { background: #fff; color: #111; border-radius: 6px; padding: 1px 8px; font-size: 18px; line-height: 1.3; }
.signbox .plat small { font-size: 11px; opacity: .7; margin-left: 2px; }
.path { list-style: none; margin: 2px 0 0; padding: 0; position: relative; }
.path::before { content: ""; position: absolute; left: 7px; top: 12px; bottom: 12px; width: 5px; background: var(--c); border-radius: 3px; }
.path li { position: relative; padding: 3px 0 3px 26px; font-size: 14px; display: flex; align-items: center; gap: 6px; }
.path li::before { content: ""; position: absolute; left: 3px; top: 50%; transform: translateY(-50%); width: 13px; height: 13px; border-radius: 50%; background: var(--surface); border: 3px solid var(--c); box-sizing: border-box; }
.path li.end { font-family: var(--display); font-weight: 700; font-size: 15.5px; }
.path li.end::before { width: 17px; height: 17px; left: 1px; background: var(--c); }
.path .no { font-family: var(--num); font-size: 12px; color: var(--muted); font-weight: 600; }
.path .pin, .rstep .pin { font-size: 11px; font-weight: 700; color: #fff; background: var(--accent); border-radius: 999px; padding: 0 7px; }


.ask { background: var(--surface); border-radius: 14px; padding: 12px 14px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; min-width: 0; margin-bottom: 12px; border: 2px solid var(--accent); }
.ask-title { font-family: var(--display); font-weight: 700; font-size: 15.5px; }
.ask-row { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; min-width: 0; }
.ask-row label { font-size: 12px; color: var(--muted); }
.ask-in { display: flex; gap: 6px; min-width: 0; width: 100%; }
.ask input { flex: 1 1 0; width: 100%; min-width: 0; -webkit-appearance: none; appearance: none; font: inherit; font-size: 16px; padding: 9px 11px; border-radius: 10px; border: 1.5px solid var(--rule); background: var(--paper); color: var(--ink); }

/* Every station becomes selectable: the full list replaces the main-stop list, and each main-to-main time is
   split evenly over the stations in between (that is the express run time; slower trains add time per stop). */
NET.forEach(L => {
  L.main = L.st.slice();
  if (!L.all || L.all.length <= L.st.length) return;
  const t = [];
  for (let k = 0; k < L.main.length - 1; k++) {
    const a = L.all.indexOf(L.main[k]), b = L.all.indexOf(L.main[k + 1]), n = b - a;
    for (let i = 0; i < n; i++) t.push(L.t[k] / n);
  }
  L.st = L.all.slice(); L.t = t;
});
/* Stops the recommended train skips: main stops like 伏見稲荷 for the Keihan limited express, plus every small station. */
NET.forEach(L => { if (L.exp) L.skip = L.st.filter(n => !L.exp.includes(n)); });
/* Lines without a named "direct" train: the slower train is the local (普通), which stops everywhere. */
NET.forEach(L => { if (L.train && !L.local) L.local = "普通"; if (L.train && !L.direct) { L.direct = L.local; L.directIsLocal = true; } });

/* Fare of one leg, counting each "get off midway" stop as a separate ride (you pay again when you re-board). */

  const seq = [from];

  const fc = groupCoord(from);
  vs.sort((a, b) => (fc ? distM(fc, groupCoord(a)) - distM(fc, groupCoord(b)) : 0));
  for (const g of vs) if (seq[seq.length - 1] !== g) seq.push(g);
  seq.push(to);

  for (let i = 0; i < seq.length - 1; i++) { const f = legFare(seq[i], seq[i + 1]); if (f) { total += f.total; any = true; } }

}

/* ----- network + route finder ----- */
const NODES = [];            // {li, si, name, g}
const ADJ = [];              // per node: [{to, w, kind}]
const GROUPS = new Map();    // g -> [node ids]
NET.forEach((L, li) => {
  L.base = NODES.length;
  L.st.forEach((name, si) => {
    const g = GROUP[`${L.id}:${name}`] || name;
    const id = NODES.length;
    NODES.push({ li, si, name, g });
    ADJ.push([]);
    if (!GROUPS.has(g)) GROUPS.set(g, []);
    GROUPS.get(g).push(id);
  });
});
function rideMin(L, a, b) { // a,b adjacent indexes
  if (L.km) return 0.6 + Math.abs(L.km[b] - L.km[a]) * 1.55;
  const i = Math.min(a, b), j = Math.max(a, b);
  if (L.loop && i === 0 && j === L.st.length - 1) return L.t[L.t.length - 1];
  return L.t[i];
}
NET.forEach(L => {
  const n = L.st.length;
  for (let i = 0; i < n - 1; i++) {
    const w = rideMin(L, i, i + 1);
    ADJ[L.base + i].push({ to: L.base + i + 1, w, kind: "ride" });
    ADJ[L.base + i + 1].push({ to: L.base + i, w, kind: "ride" });
  }
  if (L.loop) {
    const w = rideMin(L, 0, n - 1);
    ADJ[L.base].push({ to: L.base + n - 1, w, kind: "ride" });
    ADJ[L.base + n - 1].push({ to: L.base, w, kind: "ride" });
  }
});
GROUPS.forEach((ids, g) => {
  for (const a of ids) for (const b of ids) {
    if (a === b || NODES[a].li === NODES[b].li) continue;
    const A = NODES[a], B = NODES[b];
    const bothMetro = NET[A.li].metro && NET[B.li].metro;
    const w = (A.name === B.name && bothMetro) ? 3 : (WALK[g] ?? 3);
    ADJ[a].push({ to: b, w, kind: "walk" });
  }
});

/* Changing to another railway company means a new ticket and new gates, so it costs a little extra. */
const OPX = 10;
function lineCo(L) {
  if (L.id === "KS" || L.id === "KT") return "kyoto";
  if (L.id === "MO") return "mono";
  if (L.metro) return "metro";
  if (L.id.startsWith("JR")) return "jr";
  if (L.id.startsWith("HK")) return "hankyu";
  if (L.id.startsWith("HS")) return "hanshin";
  return L.id;
}
function findRoute(fromG, toG) {
  if (fromG === toG) return null;
  const PEN = 4; // per transfer, so fewer changes win close calls
  const dist = new Array(NODES.length).fill(Infinity), prev = new Array(NODES.length).fill(null), done = new Array(NODES.length).fill(false);
  const targets = new Set(GROUPS.get(toG));
  // a small nudge toward the station literally named, e.g. 心斎橋 itself rather than 四ツ橋
  for (const s of GROUPS.get(fromG)) dist[s] = NODES[s].name === fromG ? 0 : 1.5;
  while (true) {
    let u = -1, best = Infinity;
    for (let i = 0; i < NODES.length; i++) if (!done[i] && dist[i] < best) { best = dist[i]; u = i; }
    if (u < 0) break;
    done[u] = true;
    for (const e of ADJ[u]) {
      if (e.kind === "walk" && prev[u] && prev[u].kind === "walk") continue;
      if (e.kind === "walk" && prev[u] === null) continue; // no walking at the start station
      const nd = dist[u] + e.w + (e.kind === "walk" ? PEN + (lineCo(NET[NODES[u].li]) !== lineCo(NET[NODES[e.to].li]) ? OPX : 0) : 0);
      if (nd < dist[e.to]) { dist[e.to] = nd; prev[e.to] = { from: u, kind: e.kind, w: e.w }; }
    }
  }
  let end = -1, bestEnd = Infinity;
  for (const t of targets) { const c = dist[t] + (NODES[t].name === toG ? 0 : 1.5); if (c < bestEnd) { bestEnd = c; end = t; } }
  return end < 0 || bestEnd === Infinity ? null : build(end, prev);
}
function build(end, prev) {
  const edges = [];
  for (let v = end; prev[v]; v = prev[v].from) edges.unshift({ from: prev[v].from, to: v, kind: prev[v].kind, w: prev[v].w });
  const steps = [];
  for (const e of edges) {
    const last = steps[steps.length - 1];
    if (e.kind === "ride" && last && last.kind === "ride" && NODES[last.to].li === NODES[e.to].li) {
      last.to = e.to; last.n++; last.min += e.w; last.path.push(e.to); continue;
    }
    steps.push(e.kind === "ride" ? { kind: "ride", from: e.from, to: e.to, n: 1, min: e.w, second: e.to, path: [e.from, e.to] } : { kind: "walk", from: e.from, to: e.to, min: e.w });
  }
  return steps;
}
function dirText(step) {
  const A = NODES[step.from], B = NODES[step.second], L = NET[A.li], N = L.st.length;
  if (L.loop) {
    const plus = (B.si - A.si + N) % N === 1;
    return { sign: `${plus ? "内回り" : "外回り"}（往 ${NODES[step.to].name}）`, sub: L.name };
  }
  const up = B.si < A.si;
  let sign = L.dirs[up ? 0 : 1], warn = "";
  if (L.id === "M" && up && NODES[step.to].si < 2) { sign = "箕面萱野 行"; warn = "要搭「箕面萱野行」；搭到「千里中央行」就在千里中央同月台換車。"; }
  return { sign, warn };
}
function fullStops(L, fromName, toName) {
  const all = L.all; if (!all) return null;
  const a = all.indexOf(fromName), b = all.indexOf(toName);
  if (a < 0 || b < 0) return null;
  const seg = a <= b ? all.slice(a, b + 1) : all.slice(b, a + 1).reverse();

}
/* Ride-time estimate. Express time comes from the main-stop table; each extra stop a slower train makes adds about 1 minute,
   and changing trains on the platform adds about 4 minutes (walk + wait). */
const STOP_PEN = 1.0, XFER_WAIT = 4;
function segMinor(L, a, b) {
  const all = L.all; if (!all) return [];
  const i = all.indexOf(a), j = all.indexOf(b); if (i < 0 || j < 0) return [];
  return all.slice(Math.min(i, j) + 1, Math.max(i, j)).filter(n => !(L.main || L.st).includes(n));

function timeOn(L, names) {

function extraStops(L, names, only) {

}
function rideEstimate(L, names, adv) {
  const base = timeOn(L, names);
  if (L.metro || !adv || !adv.warn) return { min: base };
  const directSet = L.directStops ? new Set(L.directStops) : null;
  const direct = base + STOP_PEN * (directSet ? extraStops(L, names, directSet) : L.directIsLocal ? extraStops(L, names) : Math.round(extraStops(L, names) * 0.5));
  const local = base + STOP_PEN * extraStops(L, names);
  if (!adv.chg) {
    return { min: Math.min(direct, local), alt: L.directIsLocal ? [[`「${L.local}」`, local]] : Math.round(direct) === Math.round(local) ? [[`「${L.direct}」或「${L.local}」`, direct]] : [[`「${L.direct}」直達`, direct], [`「${L.local}」直達`, local]] };
  }
  const ci = names.indexOf(adv.chg), p1 = names.slice(0, ci + 1), p2 = names.slice(ci);
  const toSkip = (L.skip || []).includes(names[names.length - 1]);
  const via = toSkip
    ? timeOn(L, p1) + XFER_WAIT + timeOn(L, p2) + STOP_PEN * extraStops(L, p2)
    : timeOn(L, p1) + STOP_PEN * extraStops(L, p1) + XFER_WAIT + timeOn(L, p2);
  const viaLabel = toSkip ? `「${L.train}」＋在${adv.chg}換「${L.local}」` : `「${L.local}」＋在${adv.chg}換「${L.train}」`;

function trainAdvice(L, names) {

  if (!fs && !ts) return { main: `搭「${L.train}」${L.train === "普通" ? "" : "（停車站少、比較快）"}`, sub: L.tip };
  const mid = names.slice(1, -1);
  if (fs && ts) return { warn: true, main: `${L.train}不停「${from}」和「${to}」：${L.directIsLocal ? `改搭「${L.local}」` : `搭「${L.direct}」或「${L.local}」`}。` };
  if (ts) {
    const chg = [...mid].reverse().find(n => !sk.includes(n));
    return chg
      ? { warn: true, chg, chgText: `在這站換「${L.local}」`, main: `${L.train}不停「${to}」：可以搭「${L.direct}」直達；或先搭「${L.train}」到「${chg}」，再換「${L.local}」。` }
      : { warn: true, main: `${L.train}不停「${to}」：${L.directIsLocal ? `改搭「${L.local}」` : `搭「${L.direct}」或「${L.local}」`}。` };
  }
  const chg = mid.find(n => !sk.includes(n));
  return chg
    ? { warn: true, chg, chgText: `在這站換「${L.train}」`, main: `${L.train}不停「${from}」：可以搭「${L.direct}」直達；或先搭「${L.local}」到「${chg}」，再換「${L.train}」。` }
    : { warn: true, main: `${L.train}不停「${from}」：${L.directIsLocal ? `改搭「${L.local}」` : `搭「${L.direct}」或「${L.local}」`}。` };

/* ----- nearest station by GPS ----- */
function distM(a, b) {
  const R = 6371000, t = Math.PI / 180;
  const dLat = (b[0] - a[0]) * t, dLon = (b[1] - a[1]) * t;
  const s = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * t) * Math.cos(b[0] * t) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(s));
}
function nearestGroups(pos, n) {
  const best = new Map();
  NODES.forEach((nd, id) => {
    const c = COORD[`${NET[nd.li].id}:${nd.name}`]; if (!c) return;
    const d = distM(pos, c), cur = best.get(nd.g);
    if (!cur || d < cur.d) best.set(nd.g, { g: nd.g, d, name: nd.name, c });
  });
  return [...best.values()].sort((a, b) => a.d - b.d).slice(0, n);
}
function fmtDist(d) { return d < 1000 ? `約 ${Math.round(d / 10) * 10} 公尺` : `約 ${(d / 1000).toFixed(1)} 公里`; }
function groupLines(g) {
  const seen = new Map();
  for (const id of GROUPS.get(g)) { const L = NET[NODES[id].li]; seen.set(L.short + L.c, L); }
  return [...seen.values()].map(L => `<span class="dot" style="--c:${L.c}">${L.short}</span>`).join("");
}
function cityHint(c) {
  if (c[0] > 34.9) return "京都";
  if (c[1] < 135.36) return "神戸";
  if (c[1] > 135.65 && c[0] < 34.75) return "奈良";
  return "大阪";
}
function walkLink(pos, x) {
  const dest = `${x.name}駅 ${cityHint(x.c)}`;
  return `https://www.google.com/maps/dir/?api=1&origin=${pos[0]},${pos[1]}&destination=${encodeURIComponent(dest)}&travelmode=walking`;
}
let leafletP = null, miniMap = null;
function loadLeaflet() {
  if (window.L && window.L.map) return Promise.resolve(window.L);
  if (leafletP) return leafletP;
  leafletP = new Promise((ok, bad) => {
    const css = document.createElement("link");
    css.rel = "stylesheet"; css.href = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css";
    document.head.appendChild(css);
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js";
    s.onload = () => ok(window.L); s.onerror = () => { leafletP = null; bad(new Error("leaflet")); };
    document.head.appendChild(s);
  });
  return leafletP;
}
function drawMap(pos, acc, list) {
  loadLeaflet().then(Lf => {
    if (miniMap) { miniMap.remove(); miniMap = null; }
    const el = document.getElementById("miniMap"); if (!el) return;
    miniMap = Lf.map(el, { zoomControl: true, attributionControl: true });
    Lf.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "&copy; OpenStreetMap" }).addTo(miniMap);
    Lf.circle(pos, { radius: Math.max(acc, 15), color: "#2b7de9", weight: 1, fillOpacity: .12 }).addTo(miniMap);
    Lf.circleMarker(pos, { radius: 8, color: "#fff", weight: 3, fillColor: "#2b7de9", fillOpacity: 1 }).addTo(miniMap).bindPopup("你在這裡");
    const pts = [pos];
    list.forEach((x, i) => {
      const icon = Lf.divIcon({ className: "", html: `<div class="mpin">${i + 1}</div>`, iconSize: [26, 26], iconAnchor: [13, 13] });
      Lf.marker(x.c, { icon }).addTo(miniMap).bindPopup(`<b>${esc(groupName(x.g))}</b><br>${fmtDist(x.d)}<br><a href="${walkLink(pos, x)}" target="_blank" rel="noopener">🚶 帶我走過去</a>`);
      pts.push(x.c);
    });
    miniMap.fitBounds(pts, { padding: [28, 28], maxZoom: 17 });
  }).catch(() => {
    const el = document.getElementById("miniMap");
    if (el) el.outerHTML = `<div class="note">現在沒有網路，地圖無法顯示；下面的車站和步行導航按鈕一樣能用（導航需要網路）。</div>`;
  });
}
function locate() {
  const out = $("#qOut");
  if (!("geolocation" in navigator)) { out.innerHTML = `<div class="note warn">這支手機的瀏覽器不支援定位，請直接輸入地點。</div>`; return; }
  out.innerHTML = `<div class="note">定位中…（第一次會問你要不要允許取用位置）</div>`;
  navigator.geolocation.getCurrentPosition(p => {
    const pos = [p.coords.latitude, p.coords.longitude], acc = Math.round(p.coords.accuracy || 0);
    const list = nearestGroups(pos, 3);
    const far = list[0] && list[0].d > 3000;
    out.innerHTML = `<div class="ask-title" style="font-size:14.5px">離你最近的車站</div>
      <div id="miniMap" class="minimap" role="img" aria-label="你的位置和最近的三個車站"></div>
      ${list.map((x, i) => `<div class="near">
        <div class="near-top"><span class="mpin sm">${i + 1}</span><span class="near-n">${esc(groupName(x.g))}</span><span class="near-l">${groupLines(x.g)}</span></div>
        <div class="near-d">${fmtDist(x.d)}・走約 ${Math.max(1, Math.round(x.d * 1.3 / 80))} 分</div>
        <div class="near-act"><a class="walk-btn" href="${walkLink(pos, x)}" target="_blank" rel="noopener">🚶 帶我走過去</a><button type="button" class="set-btn" data-g="${esc(x.g)}">設為出發站</button></div>
      </div>`).join("")}
      <div class="note">「帶我走過去」會打開 Google 地圖的步行導航（需要網路）。定位誤差約 ${acc} 公尺，距離是直線距離。</div>
      ${far ? `<div class="note warn">你離最近的車站超過 3 公里，可能不在這個 App 的路線範圍內。</div>` : ""}`;
    drawMap(pos, acc, list);
  }, err => {
    const msg = err.code === 1
      ? "沒有取得定位權限。iPhone 請到「設定 → 隱私權與安全性 → 定位服務 → Safari 網站」改成「使用 App 期間」，再回來按一次「📍 定位」。"
      : "暫時抓不到位置（在地下或室內比較常發生），請稍後再試，或直接輸入地點。";
    out.innerHTML = `<div class="note warn">${msg}</div>`;
  }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 30000 });
}

function norm(s) {
  return String(s || "").trim().toLowerCase().replace(/[\s　・·]/g, "")

function localResolve(text) {

  for (const id in NODES) {

    if (q === nm || q === norm(g)) return { g, walk: "", label: text, exact: true };

  }).sort((a, b) => (a.blocked ? 1e9 : a.score) - (b.blocked ? 1e9 : b.score));
}
function dayLabel(d) { return `${d.d}（${d.w}）${d.title}`; }
function renderRec(label, g, walk) {
  const recs = recommend(g), out = $("#addOut");
  const ok = recs.filter(r => !r.blocked);
  if (!ok.length) { out.innerHTML = `<div class="note warn">找不到適合的日子。</div>`; return; }
  const area = cityHint(groupCoord(g));
  out.innerHTML = `<div class="note">「${esc(label)}」最近的站：<b>${esc(groupName(g))}</b>（${area}）${walk ? `，${esc(walk)}` : ""}</div>` +
    ok.slice(0, 3).map((r, i) => `<div class="rec${i === 0 ? " best" : ""}">
      <div class="rt">${i === 0 ? `<span class="tagb">建議</span>` : ""}${esc(dayLabel(r.day))}</div>
      <div class="note">${r.near.onroute ? `順路！這天搭「${esc(groupName(r.near.via.from))} → ${esc(groupName(r.near.via.to))}」會經過，<b>以「途中下車」標籤加進那段</b>` : r.near.d < WALK_TAG_M ? `離這天的「${esc(groupName(rs(r.near.g)))}」${/搭|轉/.test(walk || "") ? "很近（但要" + esc(walk.replace(/^從.+?(?=搭|轉)/, "")) + "）" : r.near.d < 300 ? "就在旁邊" : `走路約 ${Math.max(5, Math.round(r.near.d / 70 / 5) * 5)} 分`}，<b>以標籤加進那一站</b>` : `離這天的「${esc(groupName(rs(r.near.g)))}」最近（直線${fmtDist(r.near.d)}）${r.min != null ? `，從那裡搭車約 ${r.min} 分` : ""}，<b>會新增一段路程</b>`}。${r.notes.length ? `<br>⚠️ ${esc(r.notes.join("；"))}` : ""}</div>
      <div><button type="button" class="pc-btn sm${i === 0 ? " main" : ""}" data-add="${esc(r.day.id)}">排進 ${esc(r.day.d)}</button></div>
    </div>`).join("") +
    recs.filter(r => r.blocked).map(r => `<div class="note">${esc(r.day.d)}：${esc(r.blocked)}。</div>`).join("");
  out.dataset.label = label; out.dataset.g = g; out.dataset.walk = walk || ""; out.dataset.pool = "";
}
function renderAdds() {
  const box = $("#addList"); if (!box) return;
  const n = Object.keys(plan.days).length;
  const allOpts = DAYS.filter(d => !(DAY_RULE[d.id] || {}).block).map(d => `<option value="${d.id}">${d.d}（${d.w}）</option>`).join("");
  const pool = plan.pool.length ? `<div class="pool"><div class="pc-head" style="font-size:14px">📌 待定清單（${plan.pool.length}）</div>` + plan.pool.map((st, i) =>
    `<div class="pooli"><span>${esc(stopLabel(st))}${st.spots.length > 1 ? ` <span class="note">等 ${st.spots.length} 個點</span>` : ""} <span class="note">・${esc(groupName(rs(st.g)))}站</span></span>
      <span class="pb"><button type="button" class="pc-btn sm main" data-pooladv="${i}">建議哪天</button><select data-poolto="${i}" aria-label="排進哪天"><option value="">排進…</option>${allOpts}</select><button type="button" class="pc-btn sm" data-pooldel="${i}">刪除</button></span></div>`).join("") + `</div>` : "";
  box.innerHTML = pool + (n ? `<div><button type="button" class="pc-btn sm" id="addReset">全部還原成原本的行程（已調整 ${n} 天）</button></div>` : "");
}
function setHome(g, msg) {
  if (!GROUPS.has(g)) return;
  HOME_GROUP = g; savePlan();
  $("#homeSel").value = g; $("#homeName").textContent = groupName(g); $("#homeName2").textContent = groupName(g);
  $("#homeOut").innerHTML = msg ? `<div class="note">${msg}</div>` : "";
  setSel("#selFrom", HOME_GROUP);
  if (curDay) renderLegs(curDay);
}
function initPlan() {
  if (plan.adds && plan.adds.length) { for (const a of plan.adds) insertStop(a.day, { g: a.g, spots: [a.label], note: a.walk ? `到站後${a.walk}。` : "", added: true }); }
  delete plan.adds; savePlan();
  $("#homeSel").innerHTML = $("#selFrom").innerHTML;
  $("#homeSel").value = HOME_GROUP; $("#homeName").textContent = groupName(HOME_GROUP); $("#homeName2").textContent = groupName(HOME_GROUP);
  $("#homeSel").addEventListener("change", e => setHome(e.target.value, `已改成 <b>${esc(groupName(e.target.value))}</b>，每日路線裡的「飯店」都會用這站。`));
  $("#homeBadge").addEventListener("click", () => { location.hash = "trip"; $("#homeCard").open = true; $("#homeCard").scrollIntoView({ behavior: "smooth" }); });
  $("#homeFind").addEventListener("click", () => {
    const t = $("#homeText").value; const r = t.trim() && localResolve(t);
    if (!r) { $("#homeOut").innerHTML = `<div class="note warn">找不到「${esc(t)}」，可以直接從上面的選單選站，或到飯店後按「在飯店時定位」。</div>`; return; }
    setHome(r.g, `「${esc(t)}」最近的站是 <b>${esc(groupName(r.g))}</b>，已設為飯店站。`);
  });
  $("#homeLoc").addEventListener("click", () => {
    const out = $("#homeOut");
    if (!("geolocation" in navigator)) { out.innerHTML = `<div class="note warn">這支手機不支援定位。</div>`; return; }
    out.innerHTML = `<div class="note">定位中…</div>`;
    navigator.geolocation.getCurrentPosition(p => {
      const pos = [p.coords.latitude, p.coords.longitude], list = nearestGroups(pos, 3);
      out.innerHTML = `<div class="note">離你最近的三個站，點一個設為飯店站：</div><div class="pc-chips">` +
        list.map(x => `<button type="button" class="pc-btn sm" data-home="${esc(x.g)}">${esc(groupName(x.g))}・${fmtDist(x.d)}</button>`).join("") + `</div>`;
    }, () => { out.innerHTML = `<div class="note warn">抓不到位置，請允許定位或改用選單。</div>`; }, { enableHighAccuracy: true, timeout: 12000 });
  });
  $("#homeOut").addEventListener("click", e => { const b = e.target.closest("[data-home]"); if (b) setHome(b.dataset.home, `已設為 <b>${esc(groupName(b.dataset.home))}</b>。`); });

  $("#addForm").addEventListener("submit", e => {
    e.preventDefault();
    const t = $("#addText").value.trim(), out = $("#addOut");
    if (!t) return;
    const r = localResolve(t);
    if (!r) {
      out.innerHTML = `<div class="note warn">清單裡沒有「${esc(t)}」。請直接選它附近的車站：</div><div class="pc-row"><select id="addStation">${$("#selFrom").innerHTML}</select><button type="button" class="pc-btn main" id="addStationGo">用這站</button></div>`;
      $("#addStation").value = "梅田";
      $("#addStationGo").addEventListener("click", () => renderRec(t, $("#addStation").value, ""));
      return;
    }
    if (r.g === HOME_GROUP) { out.innerHTML = `<div class="note">「${esc(t)}」就在飯店站附近，任何一天出門前或回飯店後順路去就好。</div>`; return; }
    renderRec(t, r.g, r.walk);
  });
  $("#addOut").addEventListener("click", e => {
    const b = e.target.closest("[data-add]"); if (!b) return;
    const o = $("#addOut").dataset, id = b.dataset.add;
    if (o.pool !== "" && plan.pool[+o.pool]) { lastFit = insertStop(id, plan.pool.splice(+o.pool, 1)[0]); }
    else lastFit = insertStop(id, { g: o.g, spots: [o.label], note: o.walk ? `到站後${o.walk}。` : "", walkInfo: o.walk, added: true });
    savePlan();
    $("#addText").value = "";
    pickDay(id);
    toast(lastFit && lastFit.mode === "tag" ? `已把「${esc(o.label)}」以標籤加進 ${esc(DAYS.find(d => d.id === id).d)} 順路的那一站（紅底標籤）。` : `已把「${esc(o.label)}」排進 ${esc(DAYS.find(d => d.id === id).d)}，新增一段路程（虛線框），路線已接好。`);
    $("#legs").scrollIntoView({ behavior: "smooth", block: "start" });
  });
  $("#addList").addEventListener("change", e => {
    const s = e.target.closest("[data-poolto]"); if (!s || !s.value) return;
    const st = plan.pool.splice(+s.dataset.poolto, 1)[0]; insertStop(s.value, st); savePlan(); pickDay(s.value);
    toast(`已把「${esc(stopLabel(st))}」排進 ${esc(DAYS.find(d => d.id === s.value).d)}，路線已接好。`);
  });
  $("#addList").addEventListener("click", e => {
    const a = e.target.closest("[data-pooladv]");
    if (a) { const i = +a.dataset.pooladv, st = plan.pool[i]; renderRec(stopLabel(st), rs(st.g), ""); $("#addOut").dataset.pool = String(i); $("#addOut").scrollIntoView({ behavior: "smooth", block: "center" }); return; }
    const d = e.target.closest("[data-pooldel]");
    if (d) { plan.pool.splice(+d.dataset.pooldel, 1); savePlan(); renderAdds(); return; }
    if (e.target.closest("#addReset")) { plan.days = {}; plan.pool = []; savePlan(); pickDay(curDay); toast("已還原成原本的行程。"); }
  });
}

(function start() {
  const now = new Date();
  const key = String(now.getMonth() + 1) + String(now.getDate()).padStart(2, "0");
  const today = DAYS.find(d => d.id === key);
  initLine(); initAsk(); initStatic(); initPlan(); setSel("#selFrom", HOME_GROUP);
  $("#result").addEventListener("click", e => { if (e.target.closest("#whereNow")) whereNow(); });
  pickDay(today ? today.id : (store.get("metro-day") || DAYS[0].id));
  show();
})();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("service-worker.js").catch(() => {}); });
}
</script>
</body>
